<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ata - Kişisel Web Sitesi</title>
    <style>
        /* --- General Styles --- */
        :root {
            --bg-color: #f4f4f9;
            --text-color: #333;
            --accent-color: #2563eb;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        /* --- Header / Hero Section --- */
        header {
            background: linear-gradient(135deg, #1e293b, #334155);
            color: white;
            padding: 100px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 3rem;
        }

        header p {
            font-size: 1.2rem;
            opacity: 0.8;
            margin-top: 10px;
        }

        /* --- Main Content --- */
        .container {
            max-width: 800px;
            margin: -50px auto 50px; /* Overlap header */
            padding: 0 20px;
        }

        .card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        h2 {
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 10px;
            display: inline-block;
        }

        .version-control {

            top: 15px;
